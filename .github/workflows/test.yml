name: Integration checks
on: [push, pull_request]
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.7'
      - run: python super-fcc.py install-fcc
      - run: PYTHONPATH=src:upstream/fcc/src upstream/fcc/.venv/bin/python -m unittest discover -s tests -v
      - run: python super-fcc.py init
      - run: docker compose --env-file .runtime/stack.env config --quiet
